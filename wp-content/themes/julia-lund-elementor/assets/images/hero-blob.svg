<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="presentation" aria-hidden="true">
	<defs>
		<filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="70"/>
		</filter>
		<radialGradient id="gold" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#d9a94e" stop-opacity="0.95"/>
			<stop offset="100%" stop-color="#d9a94e" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="clay" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#a34a30" stop-opacity="0.9"/>
			<stop offset="100%" stop-color="#a34a30" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="plum" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#6b3a56" stop-opacity="0.85"/>
			<stop offset="100%" stop-color="#6b3a56" stop-opacity="0"/>
		</radialGradient>
	</defs>
	<g filter="url(#soften)">
		<ellipse cx="980" cy="360" rx="420" ry="360" fill="url(#gold)"/>
		<ellipse cx="1180" cy="620" rx="380" ry="420" fill="url(#clay)"/>
		<ellipse cx="850" cy="720" rx="360" ry="320" fill="url(#plum)"/>
	</g>
</svg>

name: VirtualWardrobe
options:
  bundleIdPrefix: com.julialund
  deploymentTarget:
    iOS: "17.0"

targets:
  VirtualWardrobe:
    type: application
    platform: iOS
    sources:
      - path: VirtualWardrobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julialund.virtualwardrobe
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Used to add photos of your clothing items to your wardrobe."
